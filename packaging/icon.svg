<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- mkvremux brand icon: original, brand-neutral artwork.
       A horizontal filmstrip (sprocket holes top and bottom) with a
       bold right-pointing arrow across the picture area — "remux":
       move the stream forward into a new container, no re-encode.
       Pure vector, no text, no reference to any third-party logo.
       Rendered to PNG for the AppImage and README via:
         rsvg-convert -w 256 -h 256 packaging/icon.svg -o .github/logo.png -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26374a"/>
      <stop offset="100%" stop-color="#1a2530"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ec8ff"/>
      <stop offset="100%" stop-color="#4a9ee8"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded-square backdrop -->
  <rect x="0" y="0" width="256" height="256" rx="36" fill="#0f1620"/>

  <!-- Filmstrip band -->
  <rect x="24" y="68" width="208" height="120" rx="14"
        fill="url(#band)" stroke="#3a4f63" stroke-width="3"/>

  <!-- Sprocket holes (top row) -->
  <rect x="36"  y="78" width="24" height="18" rx="4" fill="#0f1620"/>
  <rect x="76"  y="78" width="24" height="18" rx="4" fill="#0f1620"/>
  <rect x="116" y="78" width="24" height="18" rx="4" fill="#0f1620"/>
  <rect x="156" y="78" width="24" height="18" rx="4" fill="#0f1620"/>
  <rect x="196" y="78" width="24" height="18" rx="4" fill="#0f1620"/>
  <!-- Sprocket holes (bottom row) -->
  <rect x="36"  y="160" width="24" height="18" rx="4" fill="#0f1620"/>
  <rect x="76"  y="160" width="24" height="18" rx="4" fill="#0f1620"/>
  <rect x="116" y="160" width="24" height="18" rx="4" fill="#0f1620"/>
  <rect x="156" y="160" width="24" height="18" rx="4" fill="#0f1620"/>
  <rect x="196" y="160" width="24" height="18" rx="4" fill="#0f1620"/>

  <!-- Remux arrow across the picture area (shaft + head) -->
  <rect x="85" y="118" width="54" height="20" rx="4" fill="url(#arrow)"/>
  <polygon points="131,104 173,128 131,152" fill="url(#arrow)"/>
</svg>
